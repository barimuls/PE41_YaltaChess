<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Exemple Site Web</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            background-color: #eae9e9;
            color: #363636;
        }

        /* Menu vertical */
        nav {
            width: 200px;
            background-color: #333;
            color: white;
            height: 100vh;
            /* pleine hauteur */
            display: flex;
            flex-direction: column;
            position: fixed;
            /* reste en place même si on scrolle */
        }

        nav .logo {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #444;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        nav ul li {
            margin: 0;
        }

        nav ul li a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }

        nav ul li a:hover {
            background-color: #555;
        }

        /* Contenu principal */
        main {
            margin-left: 200px;
            /* espace pour le menu */
            padding: 20px;
            flex-grow: 1;
        }
        
        .mon-bouton {
        background-color: #363636;
        color: #eae9e9;
        font-size: 30px;
        padding: 12px 24px;
        margin-top: 30px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        position: relative;
        text-align: center;
        box-shadow: 0 4px #2a2a2a;
        transition: transform 0.3s ease;
        width: 150px;
        height: 70px;
        }

        /* Animation de clic */
        .mon-bouton:active {
        transform: scale(0.95); /* effet de "pression" */
        }

        /* Animation personnalisée déclenchée par JS */
        .anime {
        animation: rebond 0.3s ease;
        }

        @keyframes rebond {
        0%   { transform: scale(1); }
        50%  { transform: scale(1.2); }
        100% { transform: scale(1); }
        }


    </style>
</head>

<body>
    <!-- Bandeau avec logo et menu -->
    <nav>
        <div class="logo">
            <img src="C:\Users\ouvre\Documents\python\Html\logo.jpg" alt="Logo" width="100">
        </div>
        <ul>
            <li><a href="index">Accueil</a></li>
            <li><a href="test">À propos</a></li>
            <li><a href="test2">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Contenu principal -->
    <main>
        <h1>Bienvenue sur ECL Echec Yalta !</h1>
        <p>Ceci est la page d'accueil, appuyer sur le bouton pour commencer une partie.</p>
        <button class="mon-bouton" onclick="afficherMessage()">Jouer</button>
        <p id="message"></p>
    </main>
    <script>
        // Déclaration d'une variable
        const y = 10;

        // Affichage dans la console
        console.log("Valeur de y * 10 :", y * 10);

        // Fonction appelée quand on clique sur le bouton
        function afficherMessage() {
            // Affiche le résultat dans la page
            document.getElementById("message").innerText = "y * 10 = " + (y * 10);

            // Affiche également dans la console
            console.log("Image cliquée, y * 10 =", y * 10);
        }
    </script>
</body>
</html>
