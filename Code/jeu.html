<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Exemple Site Web</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            background-color: #eae9e9;
            color: #363636;
        }

        /* Menu vertical */
        nav {
            width: 200px;
            background-color: #333;
            color: white;
            height: 100vh;
            /* pleine hauteur */
            display: flex;
            flex-direction: column;
            position: fixed;
            /* reste en place même si on scrolle */
        }

        nav .logo {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #444;
        }

        nav .ecl {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #444;
        }


        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        nav ul li {
            margin: 0;
        }

        nav ul li a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }

        nav ul li a:hover {
            background-color: #555;
        }

        .nav-droite {
            width: 400px;
            background-color: #333;
            color: white;
            height: 100vh;
            /* pleine hauteur */
            display: flex;
            flex-direction: column;
            position: fixed; right: 0;
            /* reste en place même si on scrolle */
        }

        /* Contenu principal */
        main {
            margin-left: 200px;
            margin-right: 400px;
            /* espace pour le menu */
            padding: 20px;
            flex-grow: 1;
            position: relative;

        }

        .mon-bouton {
            background-color: #363636;
            color: #eae9e9;
            font-size: 30px;
            padding: 12px 24px;
            margin-top: 30px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            position: relative;
            text-align: center;
            box-shadow: 0 4px #2a2a2a;
            transition: transform 0.3s ease;
            width: 150px;
            height: 70px;
            display: block;
            margin: 30px auto 0 auto;
            
        }

        .bouton-fermer {
            background-color: #363636;
            color: #eae9e9;
            font-size: 30px;
            border-radius: 8px;
            padding: 5px 14px;
            border: none;
            cursor: pointer;
            position: relative;
            text-align: center;
            box-shadow: 0 4px #2a2a2a;
            transition: transform 0.3s ease;
            float: right;
        }

        /* Animation de clic */
        .mon-bouton:active {
            transform: scale(0.95);
            /* effet de "pression" */
        }

        /* Animation personnalisée déclenchée par JS */
        .anime {
            animation: rebond 0.3s ease;
        }

        @keyframes rebond {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .modal {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 900px;
            height: 80%;
            max-height: 700px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .bouton-fermer:hover {
            background-color: red;
            color: white;
            box-shadow: 0 4px #ab0101;
        }

        .mon-bouton:hover {
            background-color: green;
            color: white;
            box-shadow: 0 4px rgb(0, 87, 0);
        }

        .bloc-boutons {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 500px;/* ajuste selon l'espace que tu veux */
        }

        .bloc-boutons button {
            margin-bottom: 20px;
        }


    </style>
</head>

<body>
    <!-- Bandeau avec logo et menu -->
    <nav>
        <div class="logo">
            <img src="C:\Users\ouvre\Documents\python\Html\logo.jpg" alt="Logo" width="100">
        </div>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="test.html">À propos</a></li>
            <li><a href="test2.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="ecl">
            <img src="2024_LOGO-CENTRALE-H_BLANC.png" alt="ECL" width="160">
        </div>
        
    </nav>
    <div class="nav-droite">
    </div>

    <!-- Contenu principal -->
    <main>
        <img src="plateau.jpg" alt="Échiquier" style="width: 100%; height: auto;">
    </main>

</body>

</html>
