<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Exemple Site Web</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            background-color: #eae9e9;
            color: #363636;
        }

        /* Menu vertical */
        nav {
            width: 200px;
            background-color: #333;
            color: white;
            height: 100vh;
            /* pleine hauteur */
            display: flex;
            flex-direction: column;
            position: fixed;
            /* reste en place même si on scrolle */
        }

        nav .logo {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #444;
        }

        nav .ecl {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #444;
        }


        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        nav ul li {
            margin: 0;
        }

        nav ul li a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }

        nav ul li a:hover {
            background-color: #555;
        }

        /* Contenu principal */
        main {
            margin-left: 200px;
            /* espace pour le menu */
            padding: 20px;
            flex-grow: 1;
            position: relative;

        }

        .mon-bouton {
            background-color: #363636;
            color: #eae9e9;
            font-size: 30px;
            padding: 12px 24px;
            margin-top: 30px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            position: relative;
            text-align: center;
            box-shadow: 0 4px #2a2a2a;
            transition: transform 0.3s ease;
            width: 150px;
            height: 70px;
            display: block;
            margin: 30px auto 0 auto;
            
        }

        .bouton-fermer {
            background-color: #363636;
            color: #eae9e9;
            font-size: 30px;
            border-radius: 8px;
            padding: 5px 14px;
            border: none;
            cursor: pointer;
            position: relative;
            text-align: center;
            box-shadow: 0 4px #2a2a2a;
            transition: transform 0.3s ease;
            float: right;
        }

        /* Animation de clic */
        .mon-bouton:active {
            transform: scale(0.95);
            /* effet de "pression" */
        }

        /* Animation personnalisée déclenchée par JS */
        .anime {
            animation: rebond 0.3s ease;
        }

        @keyframes rebond {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .modal {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 900px;
            height: 80%;
            max-height: 700px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .bouton-fermer:hover {
            background-color: red;
            color: white;
            box-shadow: 0 4px #ab0101;
        }

        .mon-bouton:hover {
            background-color: green;
            color: white;
            box-shadow: 0 4px rgb(0, 87, 0);
        }

        .bloc-boutons {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 500px;/* ajuste selon l'espace que tu veux */
        }

        .bloc-boutons button {
            margin-bottom: 20px;
        }


    </style>
</head>

<body>
    <!-- Bandeau avec logo et menu -->
    <nav>
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo" width="100">
        </div>
        <ul>
            <li><a href="{{ url_for('index') }}">Accueil</a></li>
            <li><a href="{{ url_for('test') }}">À propos</a></li>
            <li><a href="{{ url_for('test2') }}">Services</a></li>
            <li><a href="{{ url_for('contact') }}">Contact</a></li>
        </ul>
        <div class="ecl">
            <img src="{{ url_for('static', filename='images/2024_LOGO-CENTRALE-H_BLANC.png') }}" alt="ECL" width="160">
        </div>
        
    </nav>

    <!-- Contenu principal -->
    <main>
        <h1>Bienvenue sur PE41 Echecs Yalta !</h1>
        <p>Ceci est la page d'accueil, appuyer sur le bouton pour commencer une partie.</p>
        <div class="bloc-boutons">
            <button class="mon-bouton" onclick="openModal2()">Jouer</button>
            <button class="mon-bouton" onclick="openModal1()">Tutoriel</button>
        </div>

        <p id="message"></p>

        <div class="overlay" id="overlay1">
            <div class="modal">
                <span class="bouton-fermer" onclick="closeModal1()">×</span>
                <h2>Tutoriel</h2>
                <p>Voici la page du tutoriel.</p>
            </div>
        </div>

        <div class="overlay" id="overlay2">
            <div class="modal" style="max-width: 600px; max-height: 400px;">
                <span class="bouton-fermer" onclick="closeModal2()">×</span>
                <h2>Jeu</h2>
                <p>Voici la page du jeu.</p>
                <button class="mon-bouton" onclick="window.location.href='{{ url_for('jeu') }}'" style="margin-top: 50px; width: 180px;">En ligne</button>
                <button class="mon-bouton" onclick="window.location.href='{{ url_for('jeu') }}'" style="margin-top: 40px; width: 180px;">En locale</button>
            </div>
        </div>
    </main>
    <script>

        function openModal1() {
            document.getElementById('overlay1').style.display = 'flex';
        }

        function closeModal1() {
            document.getElementById('overlay1').style.display = 'none';
        }

        function openModal2() {
            document.getElementById('overlay2').style.display = 'flex';
        }

        function closeModal2() {
            document.getElementById('overlay2').style.display = 'none';
        }
    </script>
</body>

</html>
