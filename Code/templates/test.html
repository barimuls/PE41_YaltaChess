<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Logo aligné</title>
    <style>
        .logo-right {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 6px; /* espace entre point et barre */
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: black;
        }

        .bar {
            height: 3px;
            background: black;
            border-radius: 2px;
        }

        .bar1 { width: 20px; }
        .bar2 { width: 28px; }
        .bar3 { width: 12px; }
    </style>
</head>
<body>

    <div class="logo-right">
        <div class="row">
            <span class="dot"></span>
            <div class="bar bar1"></div>
        </div>
        <div class="row">
            <span class="dot"></span>
            <div class="bar bar2"></div>
        </div>
        <div class="row">
            <span class="dot"></span>
            <div class="bar bar3"></div>
        </div>
    </div>

</body>
</html>
