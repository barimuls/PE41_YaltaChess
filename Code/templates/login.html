<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/login.css') }}">
</head>

<body>
<!-- Bandeau avec logo et menu -->

    <!-- Contenu principal -->
    <main>
        <div class="form-container">
        <form method="post" action="{{ url_for('login') }}">
            <label id="titre">PE41 Echecs Yalta</label>
            <div class="input-container">
                <input type="text" id="username" name="username" required placeholder="Nom d'utilisateur">
            </div>
            <div class="input-container">
                <input type="password" id="password" name="password" required placeholder="Mot de passe">
            </div>
            <div class="toggle-container">
                <input type="checkbox" id="toggle">
                <label for="toggle">Afficher le mot de passe</label>
            </div>
            <button class="mon-bouton" type="submit" style="margin-top: 10px;">Se connecter</button>
            <a href="{{ url_for('register') }}" class="register-link">Pas de compte ? S'inscrire</a>
        </form>
        </div>
        <svg style="position: absolute; top: 20px; right: 20px;" onclick="openModalConnexion()" width="50" height="50" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="90" fill="none" stroke="white" stroke-width="6" />
            <circle cx="100" cy="70" r="30" fill="none" stroke="white" stroke-width="6" />
            <path d="M 50 145 Q 100 90 150 145" fill="none" stroke="white" stroke-width="6" />
        </svg>
        <div class="logo">
            <a href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo" width="100">
            </a>
        </div>
        <ul>
            <a href="{{ url_for('index') }}">Accueil</a>
            <a href="{{ url_for('test') }}">À propos</a>
            <a href="{{ url_for('contact') }}">Contact</a>
        </ul>
        <div class="ecl">
            <img src="{{ url_for('static', filename='images/2024_LOGO-CENTRALE-H_BLANC.png') }}" alt="ECL" width="160">
        </div>
        <div class="modal_connexion" id="overlay_connexion">
            <a href="{{ url_for('user') }}">Mon compte</a>
            <a href="{{ url_for('login') }}">Se connecter</a>
            <a href="{{ url_for('register') }}">S'inscrire</a>
            <a href="{{ url_for('index') }}" onclick="logout()">Se déconnecter</a>
        </div>

    </main>
    <script src="{{ url_for('static', filename='scripts/login.js') }}"></script>
</body>
</html>
