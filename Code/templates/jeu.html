<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Exemple Site Web</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            background-color: #444;
            color: #363636;
        }

        /* Menu vertical */
        nav {
            width: 200px;
            background-color: #333;
            color: white;
            height: 100vh;
            /* pleine hauteur */
            display: flex;
            flex-direction: column;
            position: fixed;
            /* reste en place même si on scrolle */
        }

        nav .logo {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #444;
        }

        nav .ecl {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #444;
        }


        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        nav ul li {
            margin: 0;
        }

        nav ul li a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }

        nav ul li a:hover {
            background-color: #555;
        }

        .nav-droite {
            width: 400px;
            background-color: #333;
            color: white;
            height: 100vh;
            /* pleine hauteur */
            display: flex;
            flex-direction: column;
            position: fixed;
            right: 0;
            /* reste en place même si on scrolle */
        }

        /* Contenu principal */
        main {
            margin-left: 200px;
            margin-right: 400px;
            /* espace pour le menu */
            padding: 20px;
            flex-grow: 1;
            position: relative;
            background-color: #444;
            margin-top: 15px;

        }

        .mon-bouton {
            background-color: #363636;
            color: #eae9e9;
            font-size: 30px;
            padding: 12px 24px;
            margin-top: 30px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            position: relative;
            text-align: center;
            box-shadow: 0 4px #2a2a2a;
            transition: transform 0.3s ease;
            width: 150px;
            height: 70px;
            display: block;
            margin: 30px auto 0 auto;

        }

        .bouton-fermer {
            background-color: #363636;
            color: #eae9e9;
            font-size: 30px;
            border-radius: 8px;
            padding: 5px 14px;
            border: none;
            cursor: pointer;
            position: relative;
            text-align: center;
            box-shadow: 0 4px #2a2a2a;
            transition: transform 0.3s ease;
            float: right;
        }

        /* Animation de clic */
        .mon-bouton:active {
            transform: scale(0.95);
            /* effet de "pression" */
        }

        /* Animation personnalisée déclenchée par JS */
        .anime {
            animation: rebond 0.3s ease;
        }

        @keyframes rebond {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .modal {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 900px;
            height: 80%;
            max-height: 700px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .bouton-fermer:hover {
            background-color: red;
            color: white;
            box-shadow: 0 4px #ab0101;
        }

        .mon-bouton:hover {
            background-color: green;
            color: white;
            box-shadow: 0 4px rgb(0, 87, 0);
        }

        .bloc-boutons {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 500px;
            /* ajuste selon l'espace que tu veux */
        }

        .bloc-boutons button {
            margin-bottom: 20px;
        }

        .plateau {
            position: absolute;
            z-index: 1;
        }

        .pion_rouge {
            position: absolute;
            z-index: 2;
        }
    </style>
</head>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // --- 1️⃣ Fonction pour envoyer les coups au backend Flask ---
        function sendValue(maValeur) {
            fetch('/receive', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ value: maValeur })
            })
                .then(res => res.json())
                .then(data => {
                    // Affiche la réponse du serveur (par exemple "Mouvement invalide")
                    const resultEl = document.getElementById("resultat");
                    if (resultEl) resultEl.textContent = data.reponse;
                    console.log("Valeur envoyée :", maValeur);
                })
                .catch(error => console.error('Erreur lors de l’envoi :', error));
        }

        // --- 2️ Connexion au serveur Socket.IO ---
        const socket = io();

        socket.on('connect', () => {
            console.log("✅ Connecté à SocketIO");
        });

        // ---  Réception des mises à jour automatiques du plateau ---
        socket.on('update', data => {
            console.log("Mise à jour reçue :", data);

            const pieces = data.plateau_pieces;
            const couleurs = data.plateau_couleurs;

            for (const [caseName, piece] of Object.entries(pieces)) {
                const textEl = document.querySelector(`text[onclick="sendValue('${caseName}')"]`);
                const polyEl = document.querySelector(`polygon[onclick="sendValue('${caseName}')"]`);
                if (!textEl || !polyEl) continue; // ignore si la case n’existe pas

                // --- récupérer la couleur du polygone pour cases vides ---
                const polyColor = polyEl.getAttribute("fill");

                let textColor;
                if (piece === null || piece === undefined) {
                    // Case vide → couleur du texte contrastée par rapport au fond
                    if (polyColor === "#EEEED2" || polyColor.toLowerCase() === "#eeeed2") {
                        textColor = "#769656"; // fond clair → texte foncé
                    } else if (polyColor === "#769656" || polyColor.toLowerCase() === "#769656") {
                        textColor = "#EEEED2"; // fond foncé → texte clair
                    } else {
                        textColor = "#000000"; // par défaut
                    }
                    textEl.textContent = caseName; // affiche le nom de la case
                } else {
                    // Case avec pièce → couleur du joueur envoyée par le serveur
                    textColor = couleurs[caseName] || "#000000"; // si pas définie, noir
                    textEl.textContent = piece;
                }

                // --- appliquer la couleur au texte ---
                textEl.setAttribute("fill", textColor);
            }

        });

        function polygonCentroid(points) {
            let cx = 0, cy = 0;
            let area = 0;

            for (let i = 0; i < points.length; i++) {
                const j = (i + 1) % points.length;
                const cross = points[i].x * points[j].y - points[j].x * points[i].y;
                area += cross;
                cx += (points[i].x + points[j].x) * cross;
                cy += (points[i].y + points[j].y) * cross;
            }

            area *= 0.5;
            cx /= (6 * area);
            cy /= (6 * area);

            return { x: cx, y: cy };
        }

        function centerHTMLImageOnPolygon(polygonId, imgId) {
            const polygon = document.getElementById(polygonId);
            const img = document.getElementById(imgId);
            const main = document.querySelector("main");

            // Lire les points du polygon
            const points = polygon
                .getAttribute("points")
                .trim()
                .split(/\s+/)
                .map(p => {
                    const [x, y] = p.split(",").map(Number);
                    return { x, y };
                });

            // Calcul du centroïde géométrique
            const { x: cx, y: cy } = polygonCentroid(points);

            // Conversion SVG → écran
            const svg = polygon.ownerSVGElement;
            const pt = svg.createSVGPoint();
            pt.x = cx;
            pt.y = cy;
            const screenPos = pt.matrixTransform(svg.getScreenCTM());
            // Décalage par rapport à <main>
            const mainRect = main.getBoundingClientRect();
            const trueX = screenPos.x - mainRect.left;
            const trueY = screenPos.y - mainRect.top;

            // Positionner l'image
            img.style.position = "absolute";
            img.style.left = `${trueX}px`;
            img.style.top = `${trueY}px`;
            img.style.transform = "translate(-135%, -125%)";
        }

        window.onload = () => {
            centerHTMLImageOnPolygon("K7", "pion_r1");
            centerHTMLImageOnPolygon("L5", "pion_r2");
        };

    </script>
