<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Exemple Site Web</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            background-color: #eae9e9;
            color: #363636;
        }

        /* Menu vertical */
        nav {
            width: 200px;
            background-color: #333;
            color: white;
            height: 100vh;
            /* pleine hauteur */
            display: flex;
            flex-direction: column;
            position: fixed;
            /* reste en place même si on scrolle */
        }

        nav .logo {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #444;
        }

        nav .ecl {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #444;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        nav ul li {
            margin: 0;
        }

        nav ul li a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }

        nav ul li a:hover {
            background-color: #555;
        }

        /* Contenu principal */
        main {
            margin-left: 200px;
            /* espace pour le menu */
            padding: 20px;
            flex-grow: 1;
        }

        .mon-bouton {
            background-color: #363636;
            color: #eae9e9;
            font-size: 30px;
            padding: 12px 24px;
            margin-top: 30px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            position: relative;
            text-align: center;
            box-shadow: 0 4px #2a2a2a;
            transition: transform 0.3s ease;
            width: 150px;
            height: 70px;
            display: block;
            margin: 30px auto 0 auto;
        }

        .bouton-fermer {
            background-color: #363636;
            color: #eae9e9;
            font-size: 30px;
            border-radius: 8px;
            padding: 5px 14px;
            border: none;
            cursor: pointer;
            position: relative;
            text-align: center;
            box-shadow: 0 4px #2a2a2a;
            transition: transform 0.3s ease;
            float: right;
        }

        /* Animation de clic */
        .mon-bouton:active {
            transform: scale(0.95);
            /* effet de "pression" */
        }

        /* Animation personnalisée déclenchée par JS */
        .anime {
            animation: rebond 0.3s ease;
        }

        @keyframes rebond {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .modal {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 700px;
            height: 80%;
            max-height: 500px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .bouton-fermer:hover {
            background-color: red;
            color: white;
            box-shadow: 0 4px #ab0101;
        }

        .mon-bouton:hover {
            background-color: green;
            color: white;
            box-shadow: 0 4px rgb(0, 87, 0);
        }

        .image-hover {
            position: relative;
            display: inline-block;
        }

        .image-hover img {
            display: block;
            height: 30px;
            transition: filter 0.4s ease;
            filter: brightness(0.35) sepia(20) hue-rotate(0deg) saturate(0%) contrast(1);
        }

        .image-hover:hover img {
            filter: none;
        }

        .image-hv {
            position: relative;
            display: inline-block;
        }

        .image-hv img {
            display: block;
            height: 30px;
            transition: filter 0.4s ease;
        }

        .image-hv::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #363636;
            mix-blend-mode: lighten;
            /* ou try 'color' */
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .image-hv:hover::before {
            opacity: 0;
        }

        .bas-du-main {
            display: flex;
            justify-content: center;
            /* centre horizontalement */
            align-items: flex-end;
            /* aligne en bas */
            gap: 20px;
            /* espace entre les images */
            margin-top: 50px;
            height: 450px;
            /* espace depuis le contenu */
        }
    </style>
</head>

<body>
    <!-- Bandeau avec logo et menu -->
    <nav>
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo" width="100">
        </div>
        <ul>
            <li><a href="{{ url_for('index') }}">Accueil</a></li>
            <li><a href="{{ url_for('test') }}">À propos</a></li>
            <li><a href="{{ url_for('test2') }}">Services</a></li>
            <li><a href="{{ url_for('contact') }}">Contact</a></li>
        </ul>
        <div class="ecl">
            <img src="{{ url_for('static', filename='images/2024_LOGO-CENTRALE-H_BLANC.png') }}" alt="ECL" width="160">
        </div>
    </nav>

    <!-- Contenu principal -->
    <main>
        <h1>Pour nous contacter</h1>
        <p>Vous pouvez nous contacter par email à l'adresse suivante pour tous problèmes avec le site ou le jeu:
            axelle.baviere@etu.ec-lyon.fr</p>
        <div class="bas-du-main">
            <div class="image-hover">
                <a href="https://www.youtube.com/" target="_blank">
                    <img src="{{ url_for('static', filename='images/youtube.png') }}" alt="Lien vers YouTube"
                        class="image-hover">
                </a>
            </div>
            <div class="image-hv">
                <a href="https://github.com/barimuls/PE41_YaltaChess/" target="_blank">
                    <img src="{{ url_for('static', filename='images/github.png') }}" alt="Image teintée gris foncé">
                </a>
            </div>
            <div class="image-hover">
                <img src="{{ url_for('static', filename='images/discord.png') }}" alt="Image teintée gris foncé">
            </div>
        </div>


    </main>

    <script>

    </script>
</body>

</html>
